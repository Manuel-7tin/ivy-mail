<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Position Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h2>Student Position Report</h2>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Total Amount to Pay</th>
                    <th>Amount Paid</th>
                    <th>Balance Due</th>
                    <th>Study Type</th>
                    <th>Video Request Status</th>
                </tr>
            </thead>
            <tbody id="student-table">
                <!-- Table rows will be populated dynamically using JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        fetch('/students')
            .then(response => response.json())
            .then(data => {
                const table = document.getElementById('student-table');
                data.forEach(student => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${student.name}</td>
                        <td>${student.total_amount_to_pay}</td>
                        <td>${student.actual_amount_paid}</td>
                        <td>${student.balance_due}</td>
                        <td>${student.study_type}</td>
                        <td>${student.video_request_status}</td>
                    `;
                    table.appendChild(row);
                });
            });
    </script>
</body>
</html>
